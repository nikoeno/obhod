paths:
  root: /srv/splitter
secrets:
  tunnel: vps.json
  proxy: corp-proxy.json
analyzer:
  concurrency: 4
  doh:
    - https://9.9.9.9/dns-query
checker:
  lists:
    candidates: [lists/candidates.txt]
    proxy: [lists/proxy.txt]
    block: [lists/block.txt]
  schedule:
    interval: 2h
    failthreshold: 4
  unknowndefault: tunnel
singbox:
  binary: /opt/sing-box
  tun:
    name: splitter0
    address: 198.19.0.1/30
    stack: gvisor
  dns:
    direct_doh: https://9.9.9.9/dns-query
    fake_ip_range: 198.18.0.0/16
  clash_api: 127.0.0.1:9191
  own_processes: [myvpn.exe]
  block_quic: false
  log_level: warn
desync:
  engine: winws2
  binary: /opt/winws2
  strategy: ["--filter-l7=tls", "--lua-desync=fake"]
  lua_init: [zapret-lib.lua]
  exclude_ips: [203.0.113.7/32, "2001:db8::/32"]
  exclude_ports: [[50000, 50099]]
  ports: [443]
procman:
  max_restarts: 3
  restart_window: 5m
  log_lines: 50
monitor:
  poll_interval: 5s
  stall_min_age: 15s
status:
  listen: 127.0.0.1:9100
  token: abc
log:
  level: debug
  file: app.log
  max_size_mb: 5
  max_files: 2
